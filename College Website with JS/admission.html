<!DOCTYPE html>
<html>

<head>
    <title>Admission - College Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

    <div class="college-header">

        <img src="images/logo.jpg" alt="GCET Jammu Logo">

        <div class="college-text">

            <h1>GCET JAMMU</h1>

            <p>Education | Knowledge | Success</p>

        </div>

    </div>

</header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="faculty.html">Faculty</a>
        <a href="students.html">Students</a>
        <a href="gallery.html">Gallery</a>
        <a href="admission.html">Admission</a>
        <a href="contact.html">Contact</a>
    </nav>

    <h2>Admission Form</h2>

    <form id="admissionForm" action="submit.html">
        <label for="adName">Name:</label>
        <input type="text" id="adName" required>
        <br><br>

        <label for="adEmail">Email:</label>
        <input type="text" id="adEmail" required>
        <br><br>

        <label for="adDob">Date of Birth:</label>
        <input type="date" id="adDob">
        <br><br>

        <label for="adMobile">Mobile Number:</label>
        <input type="text" id="adMobile" required>
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Others"> Others
        <br><br>

        <label for="adCourse">Course:</label>
        <select id="adCourse" required>
            <option value="">Select Course</option>
            <option>Civil Engineering</option>
            <option>Computer Science Engineering</option>
            <option>Electronics & Communication Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Electrical Engineering</option>
        </select>
        <br><br>

        <label>Hobbies:</label>
        <input type="checkbox" name="hobby"> Reading
        <input type="checkbox" name="hobby"> Sports
        <input type="checkbox" name="hobby"> Music
        <br><br>

        <label for="adAddress">Address:</label><br>
        <textarea id="adAddress" rows="5" cols="40"></textarea>
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <p id="admissionMessage" class="form-message"></p>
    </form>

    <footer>
        © 2025 GCET JAMMU. All Rights Reserved.
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
