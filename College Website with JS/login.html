<!DOCTYPE html>
<html>

<head>
    <title>Student Login - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

    <div class="college-header">

        <img src="images/logo.jpg" alt="GCET Jammu Logo">

        <div class="college-text">

            <h1>GCET JAMMU</h1>

            <p>Education | Knowledge | Success</p>

        </div>

    </div>

</header>

    <div class="login-page">

        <div class="login-box">
            <img src="images/logo.jpg" alt="College Logo">
            <h2>Student Login</h2>
            <div class="login-line"></div>

            <label for="username">Roll Number</label>
            <input type="text" id="username" placeholder="Enter your roll number">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">

            <button type="button" id="loginBtn" class="login-submit">Login</button>
            <p id="loginMessage" class="form-message"></p>

            <div class="home-link">
            <a href="index.html">Back to Home</a>
            </div>
        </div>
       
    </div>

    <footer>
        © 2025 GCET JAMMU. All Rights Reserved.
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
