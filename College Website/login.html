<!DOCTYPE html>
<html>

<head>
    <title>Student Login - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

    <div class="college-header">

        <img src="images/logo.jpg" alt="GCET Jammu Logo">

        <div class="college-text">

            <h1>GCET JAMMU</h1>

            <p>Education | Knowledge | Success</p>

        </div>

    </div>

</header>

    <div class="login-page">

        <div class="login-box">

            <img src="images/logo.jpg" alt="College Logo">

            <h2>Student Login</h2>

            <div class="login-line"></div>


            
        <form action="dashboard.html" method="get">

    <label>Email</label>

    <input type="email"
           name="email"
           placeholder="Enter your college email"
           required>

    <label>Password</label>

    <input type="password"
           name="password"
           placeholder="Enter your password"
           required>

    <input type="submit"
           value="Login"
           class="login-submit">

</form>

        </div>

    </div>

    <footer>
        © 2025 GCET JAMMU. All Rights Reserved.
    </footer>

</body>

</html>
